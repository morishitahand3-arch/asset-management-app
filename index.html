<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産管理アプリ</title>

    <!-- CSS -->
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/variables.css">
    <link rel="stylesheet" href="src/css/layout.css">
    <link rel="stylesheet" href="src/css/components.css">
    <link rel="stylesheet" href="src/css/dashboard.css">
    <link rel="stylesheet" href="src/css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-logo">資産管理アプリ</h1>
                <nav class="header-nav">
                    <button class="nav-btn" data-view="dashboard">ダッシュボード</button>
                    <button class="nav-btn" data-view="assets">資産一覧</button>
                    <button class="nav-btn" data-view="new-asset">新規登録</button>
                    <button class="nav-btn" data-view="settings">設定</button>
                </nav>
            </div>
        </header>

        <div class="app-main">
            <!-- Sidebar -->
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="#" class="sidebar-link active" data-view="dashboard">
                        <span class="sidebar-icon">📊</span>
                        <span class="sidebar-text">ダッシュボード</span>
                    </a>
                    <a href="#" class="sidebar-link" data-view="assets">
                        <span class="sidebar-icon">💰</span>
                        <span class="sidebar-text">資産一覧</span>
                    </a>
                    <a href="#" class="sidebar-link" data-view="new-asset">
                        <span class="sidebar-icon">➕</span>
                        <span class="sidebar-text">新規登録</span>
                    </a>
                    <a href="#" class="sidebar-link" data-view="settings">
                        <span class="sidebar-icon">⚙️</span>
                        <span class="sidebar-text">設定</span>
                    </a>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Dashboard View -->
                <div class="view" id="dashboard-view" data-view="dashboard">
                    <h2 class="view-title">ダッシュボード</h2>
                    <div id="dashboard-content"></div>
                </div>

                <!-- Assets List View -->
                <div class="view" id="assets-view" data-view="assets" style="display: none;">
                    <h2 class="view-title">資産一覧</h2>
                    <div id="assets-content"></div>
                </div>

                <!-- New Asset Form View -->
                <div class="view" id="new-asset-view" data-view="new-asset" style="display: none;">
                    <h2 class="view-title">新規資産登録</h2>
                    <div id="form-content"></div>
                </div>

                <!-- Edit Asset Form View -->
                <div class="view" id="edit-asset-view" data-view="edit-asset" style="display: none;">
                    <h2 class="view-title">資産編集</h2>
                    <div id="edit-form-content"></div>
                </div>

                <!-- Settings View -->
                <div class="view" id="settings-view" data-view="settings" style="display: none;">
                    <h2 class="view-title">設定</h2>
                    <div id="settings-content"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Main Application Script -->
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
